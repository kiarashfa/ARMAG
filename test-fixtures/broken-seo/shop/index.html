<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Known-bad Three.js fence fixture</title>
  </head>
  <body>
    <h1>Three.js outside the range</h1>
    <!--
      Deliberate defect 3 — a 3D engine on a page that is not
      /guns/<slug>/range/. SPEC.md §11 fences Three.js to the v2 shooting range
      so it can never become part of a spec page's JS budget; no range page
      exists in v1, so the fence is currently absolute.
    -->
    <script>
      const renderer = new THREE.WebGLRenderer({ antialias: true });
    </script>
  </body>
</html>
